<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>나의 포트폴리오</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f1f3f6;
        --card: #fff;
        --ink: #191f28;
        --sub: #8b95a1;
        --line: #e5e8eb;
        --soft: #f5f6f8;
        --blue: #3b82f6;
        --blue-soft: #eaf2ff;
        --bar: #d9dde3;
        --dark: #4e5968;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #101216;
          --card: #1b1e24;
          --ink: #f2f4f6;
          --sub: #8b95a1;
          --line: #2a2e36;
          --soft: #23272e;
          --blue-soft: #1b2b47;
          --bar: #3a3f49;
          --dark: #5b6575;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #101216;
        --card: #1b1e24;
        --ink: #f2f4f6;
        --sub: #8b95a1;
        --line: #2a2e36;
        --soft: #23272e;
        --blue-soft: #1b2b47;
        --bar: #3a3f49;
        --dark: #5b6575;
        color-scheme: dark;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Noto Sans KR",
          -apple-system,
          "Apple SD Gothic Neo",
          "Malgun Gothic",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border: 0;
        background: none;
      }
      .wrap {
        max-width: 1040px;
        margin: 0 auto;
        padding: 0 20px 80px;
      }
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 20;
        background: color-mix(in srgb, var(--bg) 85%, transparent);
        backdrop-filter: blur(12px);
      }
      .nav {
        max-width: 1040px;
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 60px;
        border-bottom: 1px solid var(--line);
      }
      .logo {
        font-weight: 900;
        font-size: 18px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .logo i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--blue);
      }
      .tabs {
        display: flex;
        gap: 4px;
        overflow-x: auto;
      }
      .tab {
        position: relative;
        padding: 8px 12px;
        font-size: 14px;
        font-weight: 500;
        color: var(--sub);
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        transition: color 0.2s;
      }
      .tab:hover {
        color: var(--ink);
      }
      .tab.on {
        color: var(--ink);
        font-weight: 700;
      }
      .tab::after {
        content: "";
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: -1px;
        height: 2px;
        border-radius: 2px;
        background: var(--blue);
        transform: scaleX(0);
        transition: transform 0.25s ease;
      }
      .tab.on::after {
        transform: scaleX(1);
      }
      .page {
        animation: in 0.35s ease both;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .hero {
        padding: 48px 0 32px;
      }
      .hero h1 {
        font-size: clamp(30px, 6vw, 48px);
        line-height: 1.25;
        font-weight: 900;
        margin: 0;
        letter-spacing: -0.03em;
      }
      .hero h1 b {
        color: var(--blue);
      }
      .hero p {
        color: var(--sub);
        margin: 14px 0 0;
        font-size: 15px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      @media (max-width: 860px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 540px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .tab span {
          display: none;
        }
      }
      .card {
        background: var(--card);
        border-radius: 24px;
        padding: 14px 14px 18px;
        border: 2px solid transparent;
        text-align: left;
        display: flex;
        flex-direction: column;
        transition:
          transform 0.25s,
          box-shadow 0.25s,
          border-color 0.25s;
      }
      .card:hover {
        transform: translateY(-4px);
        border-color: var(--blue);
        box-shadow: 0 12px 30px rgba(59, 130, 246, 0.15);
      }
      .card:hover .num,
      .card:hover h3 {
        color: var(--blue);
      }
      .prev {
        background: var(--soft);
        border-radius: 16px;
        aspect-ratio: 16/10;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }
      .meta {
        padding: 16px 6px 0;
        flex: 1;
      }
      .num {
        font-weight: 700;
        color: var(--blue);
        margin-right: 8px;
        font-size: 15px;
        transition: color 0.2s;
      }
      h3 {
        display: inline;
        font-size: 18px;
        font-weight: 700;
        margin: 0;
        transition: color 0.2s;
      }
      .en {
        color: var(--sub);
        font-size: 14px;
        margin: 4px 0 0;
      }
      .desc {
        color: var(--sub);
        font-size: 13.5px;
        margin: 10px 0 0;
        line-height: 1.55;
      }
      .go {
        margin: 16px 6px 0;
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 9px 14px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
        background: var(--blue-soft);
        color: var(--blue);
        transition:
          background 0.2s,
          color 0.2s;
      }
      .go svg {
        transition: transform 0.2s;
      }
      .card:hover .go,
      .go:hover {
        background: var(--blue);
        color: #fff;
      }
      .card:hover .go svg {
        transform: translateX(3px);
      }
      .mini {
        display: flex;
        flex-direction: column;
        gap: 7px;
        width: 62%;
      }
      .mini s {
        display: block;
        height: 7px;
        border-radius: 4px;
        background: var(--bar);
        text-decoration: none;
      }
      .mini s:first-child {
        background: var(--blue);
        width: 60%;
      }
      .mini s:nth-child(3) {
        width: 75%;
      }
      .dots {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        width: 56%;
      }
      .dots s {
        aspect-ratio: 1;
        border-radius: 8px;
        background: var(--bar);
      }
      .dots s:first-child {
        background: var(--blue);
      }
      .av {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: var(--blue);
        margin-right: 14px;
      }
      .tl {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 60%;
      }
      .tl s {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 8px;
      }
      .tl s::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--blue);
        flex: none;
      }
      .tl s::after {
        content: "";
        height: 7px;
        border-radius: 4px;
        background: var(--bar);
        flex: 1;
      }
      .sec {
        font-size: 22px;
        font-weight: 900;
        margin: 48px 0 16px;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .profile {
        display: flex;
        gap: 28px;
        align-items: center;
        background: var(--card);
        border-radius: 28px;
        padding: 28px;
        margin-top: 8px;
      }
      @media (max-width: 600px) {
        .profile {
          flex-direction: column;
          text-align: center;
        }
      }
      .photo {
        width: 150px;
        height: 150px;
        flex: none;
        border-radius: 50%;
        background: var(--soft);
        border: 2px dashed var(--bar);
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--sub);
        transition: border-color 0.2s;
      }
      .photo:hover {
        border-color: var(--blue);
        color: var(--blue);
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .photo input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }
      .profile h2 {
        margin: 0;
        font-size: 26px;
        font-weight: 900;
      }
      .profile p {
        color: var(--sub);
        line-height: 1.7;
        margin: 10px 0 0;
        font-size: 15px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }
      @media (max-width: 600px) {
        .chips {
          justify-content: center;
        }
      }
      .chip {
        font-size: 12.5px;
        font-weight: 500;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--blue-soft);
        color: var(--blue);
      }
      .filters {
        display: flex;
        gap: 8px;
        margin: 0 0 20px;
        flex-wrap: wrap;
      }
      .f {
        padding: 9px 16px;
        border-radius: 999px;
        background: var(--card);
        font-size: 14px;
        font-weight: 500;
        color: var(--sub);
        transition: all 0.2s;
      }
      .f:hover {
        color: var(--ink);
      }
      .f.on {
        background: var(--blue);
        color: #fff;
        font-weight: 700;
      }
      .tag {
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 11px;
        font-weight: 700;
        padding: 4px 9px;
        border-radius: 999px;
        background: var(--card);
        color: var(--blue);
      }
      .time {
        margin-top: 8px;
        padding-left: 22px;
        border-left: 2px solid var(--line);
      }
      .ti {
        position: relative;
        background: var(--card);
        border-radius: 20px;
        padding: 18px 20px;
        margin-bottom: 14px;
        transition: transform 0.2s;
      }
      .ti:hover {
        transform: translateX(4px);
      }
      .ti::before {
        content: "";
        position: absolute;
        left: -30px;
        top: 24px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--blue);
        border: 3px solid var(--bg);
      }
      .ti small {
        color: var(--blue);
        font-weight: 700;
        font-size: 13px;
      }
      .ti h4 {
        margin: 4px 0 0;
        font-size: 16px;
      }
      .ti p {
        margin: 6px 0 0;
        color: var(--sub);
        font-size: 14px;
      }
      .ov {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(10, 12, 16, 0.5);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        animation: fade 0.2s both;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      .modal {
        background: var(--card);
        border-radius: 28px;
        max-width: 520px;
        width: 100%;
        padding: 16px 16px 24px;
        animation: pop 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
        position: relative;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.94) translateY(10px);
        }
      }
      .modal .prev {
        aspect-ratio: 16/9;
      }
      .x {
        position: absolute;
        top: 24px;
        right: 24px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--card);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s;
      }
      .x:hover {
        transform: rotate(90deg);
      }
      .modal .body {
        padding: 18px 8px 0;
      }
      .modal h3 {
        font-size: 22px;
        display: block;
      }
      .modal .go {
        margin: 18px 0 0;
        background: var(--blue);
        color: #fff;
        text-decoration: none;
      }
      a.go {
        text-decoration: none;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>

    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>

      function Home({ go }) {
        return html`<div>
          <section class="hero">
            <h1>안녕하세요,<br /><b>제 작업</b>을 소개해요</h1>
            <p>카드를 눌러 원하는 곳으로 이동해 보세요.</p>
          </section>
          <div class="grid">
            ${SECTIONS.map(
              (s, i) =>
                html` <button
                  key=${s.to}
                  class="card"
                  onClick=${() => go(s.to)}
                >
                  <div class="prev"><${Preview} kind=${s.k} /></div>
                  <div class="meta">
                    <span class="num">${String(i + 1).padStart(2, "0")}</span>
                    <h3>${s.t}</h3>
                    <p class="en">${s.en}</p>
                    <p class="desc">${s.d}</p>
                  </div>
                  <span class="go">${s.b} <${Icon} n="arrow" s=${15} /></span>
                </button>`,
            )}
          </div>
        </div>`;
      }

      function Modal({ item, onClose }) {
        useEffect(() => {
          const h = (e) => e.key === "Escape" && onClose();
          window.addEventListener("keydown", h);
          return () => window.removeEventListener("keydown", h);
        }, []);
        return html`<div class="ov" onClick=${onClose}>
          <div class="modal" onClick=${(e) => e.stopPropagation()}>
            <button class="x" onClick=${onClose} aria-label="닫기">
              <${Icon} n="x" />
            </button>
            <div class="prev"><${Preview} kind="mini" /></div>
            <div class="body">
              <h3>${item.title}</h3>
              <p class="en">${item.sub}</p>
              <p class="desc" style=${{ fontSize: "15px" }}>${item.desc}</p>
              <a class="go" href=${item.url} target="_blank" rel="noopener"
                >열어보기 <${Icon} n="ext" s=${15}
              /></a>
            </div>
          </div>
        </div>`;
      }

      function About() {
        const [photo, setPhoto] = useState(null);
        const [open, setOpen] = useState(null);
        const pick = (e) => {
          const f = e.target.files[0];
          if (!f) return;
          const r = new FileReader();
          r.onload = () => setPhoto(r.result);
          r.readAsDataURL(f);
        };
        useEffect(() => {
          if (location.hash.includes("edu"))
            document
              .getElementById("edu")
              ?.scrollIntoView({ behavior: "smooth" });
        }, []);
        return html`<div>
          <section class="hero">
            <h1>저를 <b>소개</b>할게요</h1>
          </section>
          <div class="profile">
            <label class="photo" title="프로필 사진 첨부">
              ${photo
                ? html`<img src=${photo} alt="프로필" />`
                : html`<div style=${{ textAlign: "center", fontSize: "12px" }}>
                    <${Icon} n="camera" s=${26} /><br />사진 추가
                  </div>`}
              <input type="file" accept="image/*" onChange=${pick} />
            </label>
            <div>
              <h2>${PROFILE.name}</h2>
              <p>${PROFILE.bio}</p>
              <div class="chips">
                ${PROFILE.chips.map(
                  (c) => html`<span key=${c} class="chip">${c}</span>`,
                )}
              </div>
            </div>
          </div>
          <h2 class="sec" id="edu">
            교육안
            <span
              class="en"
              style=${{ margin: 0, fontWeight: 400, fontSize: "14px" }}
              >Lesson plans</span
            >
          </h2>
          <div class="grid">
            ${EDU.map(
              (e, i) =>
                html` <button
                  key=${e.title}
                  class="card"
                  onClick=${() => setOpen(e)}
                >
                  <div class="prev"><${Preview} kind="mini" /></div>
                  <div class="meta">
                    <span class="num">${String(i + 1).padStart(2, "0")}</span>
                    <h3>${e.title}</h3>
                    <p class="en">${e.sub}</p>
                  </div>
                  <span class="go">미리보기 <${Icon} n="ext" s=${15} /></span>
                </button>`,
            )}
          </div>
          ${open &&
          html`<${Modal} item=${open} onClose=${() => setOpen(null)} />`}
        </div>`;
      }

      function Works({ initial }) {
        const [cat, setCat] = useState(initial || "all");
        const [open, setOpen] = useState(null);
        const list = WORKS.filter((w) => cat === "all" || w.cat === cat);
        return html`<div>
          <section class="hero">
            <h1>직접 <b>만든 것들</b></h1>
            <p>CRUD 미니앱부터 바이브코딩, 배포한 앱까지 전시해요.</p>
          </section>
          <div class="filters">
            ${Object.entries(CATS).map(
              ([k, v]) =>
                html`<button
                  key=${k}
                  class=${"f" + (cat === k ? " on" : "")}
                  onClick=${() => setCat(k)}
                >
                  ${v}
                </button>`,
            )}
          </div>
          <div class="grid" key=${cat}>
            ${list.map(
              (w, i) =>
                html` <button
                  key=${w.title}
                  class="card page"
                  style=${{ animationDelay: i * 40 + "ms" }}
                  onClick=${() => setOpen(w)}
                >
                  <div class="prev">
                    <span class="tag">${CATNAME[w.cat]}</span
                    ><${Preview} kind="dots" />
                  </div>
                  <div class="meta">
                    <h3>${w.title}</h3>
                    <p class="en">${w.sub}</p>
                    <p class="desc">${w.desc}</p>
                  </div>
                  <span class="go">자세히 <${Icon} n="arrow" s=${15} /></span>
                </button>`,
            )}
          </div>
          ${open &&
          html`<${Modal} item=${open} onClose=${() => setOpen(null)} />`}
        </div>`;
      }

      function History() {
        return html`<div>
          <section class="hero">
            <h1><b>활동이력</b></h1>
            <p>걸어온 순서대로 정리했어요.</p>
          </section>
          <div class="time">
            ${HISTORY.map(
              (h) =>
                html`<div key=${h.title} class="ti">
                  <small>${h.date}</small>
                  <h4>${h.title}</h4>
                  <p>${h.desc}</p>
                </div>`,
            )}
          </div>
        </div>`;
      }

      function App() {
        const parse = () => {
          const [p, q] = (location.hash.slice(1) || "home").split("?");
          return { r: p.split("#")[0] || "home", q: q || "", raw: p };
        };
        const [loc, setLoc] = useState(parse());
        useEffect(() => {
          const h = () => setLoc(parse());
          window.addEventListener("hashchange", h);
          return () => window.removeEventListener("hashchange", h);
        }, []);
        const go = (to) => {
          location.hash = to === "about#edu" ? "about" : to;
          setLoc(parse());
          window.scrollTo({ top: 0 });
          if (to === "about#edu")
            setTimeout(
              () =>
                document
                  .getElementById("edu")
                  ?.scrollIntoView({ behavior: "smooth" }),
              450,
            );
        };
        const r = ROUTES.some((x) => x.id === loc.r) ? loc.r : "home";
        const view = {
          home: html`<${Home} go=${go} />`,
          about: html`<${About} />`,
          works: html`<${Works}
            initial=${loc.q === "vibe" ? "vibe" : "all"}
          />`,
          history: html`<${History} />`,
        }[r];
        return html`<div>
          <header>
            <div class="nav">
              <div class="logo"><i></i>Portfolio</div>
              <nav class="tabs">
                ${ROUTES.map(
                  (t) =>
                    html`<button
                      key=${t.id}
                      class=${"tab" + (r === t.id ? " on" : "")}
                      onClick=${() => go(t.id)}
                    >
                      <${Icon} n=${t.icon} s=${16} /><span>${t.label}</span>
                    </button>`,
                )}
              </nav>
            </div>
          </header>
          <main class="wrap">
            <div class="page" key=${r + loc.q}>${view}</div>
          </main>
        </div>`;
      }
      ReactDOM.createRoot(document.getElementById("root")).render(
        html`<${App} />`,
      );
    </script>
  </body>
</html>
